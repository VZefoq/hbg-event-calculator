<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>HBG Prototype Calculator</title>
    <meta name="description" content="Heroes Battlegrounds Prototype Event Calculator: Calculate when Prototype spawns based on your server uptime and server type.">
    <meta name="author" content="zef">
    <meta name="keywords" content="Heroes Battlegrounds, HBG, Prototype Event, Event Timer, Game Calculator, roblox">
</head>
<body>
    <div class="container">
        <h1>HBG Prototype Calculator</h1>
        <div class="subtitle">Calculates when Prototype spawns in your current server.</div>

        <div class="input-group">
            <label>Are you in a private server or public server?</label>
            <div class="server-options" role="radiogroup" aria-label="Server type">
                <label class="server-option">
                    <input type="radio" name="server-type" value="public" checked>
                    <span>Public Server</span>
                </label>
                <label class="server-option">
                    <input type="radio" name="server-type" value="private">
                    <span>Private Server</span>
                </label>
            </div>
        </div>

        <div class="input-group">
            <label for="uptime">Server Uptime</label>
            <div class="time-inputs">
                <div class="time-input-wrapper">
                    <input type="text" id="hours" maxlength="2" placeholder="00">
                    <span class="time-label">H</span>
                </div>
                <span class="time-separator">:</span>
                <div class="time-input-wrapper">
                    <input type="text" id="minutes" maxlength="2" placeholder="00">
                    <span class="time-label">M</span>
                </div>
                <span class="time-separator">:</span>
                <div class="time-input-wrapper">
                    <input type="text" id="seconds" maxlength="2" placeholder="00">
                    <span class="time-label">S</span>
                </div>
            </div>
        </div>

        <button onclick="calculate()">Calculate Prototype Spawn</button>

        <div class="error" id="error"></div>

        <div class="result-box" id="result"></div>

        <div class="info-box">
            <h3>Where to find Server uptime?</h3>
            <ul>
                <li>Open HBG Settings</li>
                <li>Search for Server Uptime</li>
                <li>Pick public or private server before calculating</li>
            </ul>
        </div>

        <div class="footer">
            Made by zef
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
